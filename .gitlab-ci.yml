include:
  - project: 'rxcc_computation/sheff/devops/sheff_gitlab_ci'
    ref: main
    file: 'setup_build.yml' 

stages:
  - build

build_ubuntu_22:
  stage: build
  extends: .build_ubuntu_22
  script:
    # Ensure the latest JSON artifacts are in ../json/install_dir
    - ./sheff_gitlab_ci/import_artifacts.sh json $OS

    # Ensure the latest utility artifacts are in ../utility/install_dir
    - ./sheff_gitlab_ci/import_artifacts.sh utility $OS

    - python3 make.py --config --build --verbose --make-tests --mode=Debug --test
    - python3 make.py --config --build --verbose --make-tests --mode=RelWithDebInfo

build_centos_7:
  stage: build
  extends: .build_centos_7
  script:
    # Ensure the latest JSON artifacts are in ../json/install_dir
    - ./sheff_gitlab_ci/import_artifacts.sh json $OS

    # Ensure the latest utility artifacts are in ../utility/install_dir
    - ./sheff_gitlab_ci/import_artifacts.sh utility $OS

    - python3 make.py --config --build --verbose --make-tests --mode=Debug --test
    - python3 make.py --config --build --verbose --make-tests --mode=RelWithDebInfo
